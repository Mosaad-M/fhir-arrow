[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "fhir-arrow"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
install = "mojo-pkg install"
test-ndjson = "bash -c 'mojo run $(cat .mojo_flags 2>/dev/null) test_ndjson.mojo'"
test-fast-shred = "bash -c 'mojo run $(cat .mojo_flags 2>/dev/null) test_fast_shred.mojo'"
test-fhir-arrow = "bash -c 'mojo run $(cat .mojo_flags 2>/dev/null) test_fhir_arrow.mojo'"
bench-fhir-arrow = "bash -c 'mojo run $(cat .mojo_flags 2>/dev/null) bench_fhir_arrow.mojo'"
build-parallel-worker = "bash -c 'mojo build $(cat .mojo_flags 2>/dev/null) parallel_worker.mojo -O3 -o parallel_worker'"
build-merge-worker = "bash -c 'mojo build $(cat .mojo_flags 2>/dev/null) merge_worker.mojo -O3 -o merge_worker'"
build-chunk-planner = "bash -c 'mojo build $(cat .mojo_flags 2>/dev/null) chunk_planner.mojo -O3 -o chunk_planner'"
format = "mblack ndjson.mojo resources.mojo fast_shred.mojo fhir_arrow.mojo parallel_worker.mojo merge_worker.mojo chunk_planner.mojo test_ndjson.mojo test_fast_shred.mojo test_fhir_arrow.mojo"

[dependencies]
mojo = ">=1.0.0"
